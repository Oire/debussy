name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: Manifests and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifests, frontmatter, and hook wiring
        run: python3 tests/validate-repo.py

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint every shell script
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck

  bash-hooks:
    name: Bash runners (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships bash 3.2 as /bin/bash, which is the portability floor the
        # runners claim to hold to. Nothing else tests that claim.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Report the shell under test
        run: |
          /bin/bash --version | head -1
          echo "jq: $(command -v jq || echo 'not installed')"
      - name: Run the hook test suites
        run: |
          for t in tests/test-*.sh; do
            echo "== $t =="
            /bin/bash "$t"
          done

  bash-hooks-without-jq:
    name: Bash runners (no jq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The runners fall back to scanning the raw stdin payload when jq is
      # absent, and that fallback is the real-world path on machines that never
      # installed jq. A regression there is invisible in a normal run.
      - name: Hide jq
        run: |
          jqbin=$(command -v jq || true)
          if [ -n "$jqbin" ]; then sudo mv "$jqbin" "$jqbin.hidden"; fi
          echo "jq: $(command -v jq || echo 'not installed')"
      - name: Run the hook test suites
        run: |
          for t in tests/test-*.sh; do
            echo "== $t =="
            /bin/bash "$t"
          done

  powershell-hooks:
    name: PowerShell runners (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Run the hook test suites under PowerShell 7
        shell: pwsh
        run: |
          $failed = 0
          foreach ($t in Get-ChildItem tests/test-*.ps1) {
            Write-Host "== $($t.Name) =="
            & pwsh -NoProfile -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }
      # settings/settings.windows.example.json wires these hooks with
      # powershell.exe, so Windows PowerShell 5.1 is a supported target and its
      # differences from 7 are real (native stderr becomes an error record).
      - name: Run the hook test suites under Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = 0
          foreach ($t in Get-ChildItem tests/test-*.ps1) {
            Write-Host "== $($t.Name) =="
            & powershell -NoProfile -File $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          if ($failed -gt 0) { exit 1 }

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [structure, shellcheck, bash-hooks, bash-hooks-without-jq, powershell-hooks]
    if: always()
    steps:
      # One check to require in branch protection, instead of naming every job
      # here and forgetting to add the next one.
      - name: Fail unless every job succeeded
        run: |
          ok=1
          for result in ${{ join(needs.*.result, ' ') }}; do
            echo "job result: $result"
            [ "$result" = "success" ] || ok=0
          done
          [ "$ok" = "1" ]
